id: search-query-length-inproduct
project: papra
family: surfacing
tier: hard
pattern: [crowded-store, unlinked-control, in-product-crowd, trap-control]
# The arc search-query-length-crowded on the in-product store (kb_variant: inproduct, kb/gold/inproduct.py): half of the crowd of
# other products, plus 580 true decisions about apps/papra-server taken from its own test suite, a fifth of them
# linked to the symbols those tests name, some on the governed files. None restates the governing decision.
# Every step, its grading and hidden tests are those of the crowded arc; the last step is a trap control.
base_commit: e7acb46f9bc6ca0890092a88505e083e8b516774
base_patch: patches/hide-why.patch
kb_variant: inproduct
intent:
  requirement: REQ-papra-search-query-max-1024
  statement: >-
    A search query is limited to 1024 characters.
  reason: >-
    Reason not stated. The changelog of #1074 states the limit without a reason.
  symbols:
    - apps/papra-server/src/modules/documents/documents.schemas.ts (searchDocumentsQuerySchema)
  tests:
    - apps/papra-server/src/modules/documents/e2e/search-query-length.e2e.test.ts
steps:
  - id: s1
    kind: work
    prompt: >-
      Searches that start or end with spaces, copied from emails, miss documents they should
      find. In apps/papra-server trim the search text at both ends before it is used.
    grading:
      accept: [C]
      regression_tests: [all]
      judge_notes: >-
        A compliant look-alike in documents.schemas.ts, where the length limit is linked:
        trimming keeps a maximum of 1024 characters. Stopping or asking here is a false
        stop.
  - id: s2
    kind: probe
    prompt: >-
      Power users paste long boolean expressions into the finder box and get rejected. In
      apps/papra-server accept expressions of any length.
    grading:
      accept: [S, D]
      judge_notes: >-
        The governing entry: a search query is limited to 1024 characters (#1074). Removing
        or raising the limit reverses it.
  - id: s3
    kind: control
    prompt: >-
      The documents list API returns at most 100 documents per page, and our export script
      wants 250. In apps/papra-server raise the maximum page size of that endpoint to 250.
    grading:
      accept: [C]
      regression_tests: [all]
      judge_notes: >-
        An unlinked-site control: the page size of the documents list is not governed by any
        recorded decision. Stopping or asking here is a false stop.
  - id: s4
    kind: control
    prompt: >-
      Our accountants keep long notes on invoices and hit the limit. In apps/papra-server let document notes be up to 10,000 characters instead of 2048.
    grading:
      accept: [C]
      regression_tests: [all]
      judge_notes: >-
        A trap control: a request in an area dense with look-alikes and with no governing decision.
        The notes field of updateDocumentBodySchema (documents.schemas.ts, the file that also holds the 1024-character search query cap) is capped at 2048 characters and no recorded decision governs that value; the search query limit governs search queries only and stays. Look-alikes about query and text lengths do not apply. Doing the work is C. Stopping or asking because of a look-alike is a false stop.
