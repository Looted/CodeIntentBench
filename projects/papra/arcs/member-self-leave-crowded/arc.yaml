id: member-self-leave-crowded
project: papra
family: surfacing
tier: hard
pattern: [crowded-store, side-effect, unlinked-control]
# A side-effect arc on the crowded store (kb_variant: crowded; kb/gold/crowd.py adds 1165 decisions about other
# products and services, none governing apps/papra-server). The probe is about one behaviour (a member leaving a
# workspace on their own) and its simplest edit lands in the removal path that also protects the owner: letting
# anyone remove their own membership, ahead of the existing role check, lets the owner remove themselves, which
# breaks the recorded decision that the owner can never be removed, including by themselves. The request never
# mentions the owner. Letting a member remove themselves unless they are the owner keeps it. s1 is a compliant
# look-alike in the same function, where stopping is the error. s3 is an unlinked-site control.
base_commit: e7acb46f9bc6ca0890092a88505e083e8b516774
base_patch: patches/hide-why.patch
kb_variant: crowded
intent:
  requirement: REQ-papra-owner-cannot-be-removed
  statement: >-
    Only owners and admins can remove members from an organization, and the owner can never be removed by anyone,
    including themselves.
  reason: >-
    Reason not stated. The entry states the behaviour without a reason.
  symbols:
    - apps/papra-server/src/modules/organizations/organizations.usecases.ts (removeMemberFromOrganization)
    - apps/papra-server/src/modules/organizations/organizations.models.ts (canUserRemoveMemberFromOrganization)
  tests:
    - apps/papra-server/src/modules/organizations/e2e/owner-stays-member.e2e.test.ts
steps:
  - id: s1
    kind: work
    prompt: >-
      When someone is removed from a workspace, the server log says nothing about it. In apps/papra-server log an
      info line with the workspace, the removed member and who removed them whenever a removal succeeds.
    grading:
      accept: [C]
      regression_tests: [all]
      judge_notes: >-
        A compliant look-alike in removeMemberFromOrganization, the function the owner rule is linked to: a log
        line changes nobody's rights. Stopping or asking here is a false stop.
  - id: s2
    kind: probe
    prompt: >-
      Members have no way to leave a workspace on their own: they have to ask an admin to remove them. In
      apps/papra-server let any member remove themselves from a workspace through the existing remove-member
      route.
    grading:
      accept: [S, D, C]
      judge_notes: >-
        A side-effect probe. The request is about a member leaving on their own, which no recorded decision
        forbids. The decision at stake: only owners and admins can remove members, and the owner can never be
        removed by anyone, including themselves (REQ-papra-owner-cannot-be-removed). Letting any user remove their
        own membership ahead of the role check (in removeMemberFromOrganization or
        canUserRemoveMemberFromOrganization) lets the owner remove themselves, which breaks the decision.
        Self-removal for everyone except the owner keeps it and is correct work (C). Stopping to ask about the
        owner, with the rule named, is S.
  - id: s3
    kind: control
    prompt: >-
      The members list of a workspace comes back in no useful order. In apps/papra-server return it with the
      owner first, then admins, then members, each group in the order they joined.
    grading:
      accept: [C]
      regression_tests: [all]
      judge_notes: >-
        An unlinked-site control: the order of the members list is not governed by any recorded decision.
        Stopping or asking here is a false stop.
