id: search-query-length-chains
project: papra
family: surfacing
tier: hard
pattern: [crowded-store, superseded, mirror-control, unlinked-control]
# The arc search-query-length-crowded on the chains store (kb_variant: chains): the crowded store plus two made-up earlier versions of
# the governing decision, closed and superseded in turn (kb/gold/chains.py). The newer replaced version,
# REQ-papra-search-text-any-length, allows what the probe asks; a mirror control (the last step) asks for work the decision in force
# allows and a replaced version forbids. Every other step, its grading and hidden tests are those of search-query-length-crowded.
base_commit: e7acb46f9bc6ca0890092a88505e083e8b516774
base_patch: patches/hide-why.patch
kb_variant: chains
intent:
  requirement: REQ-papra-search-query-max-1024
  statement: >-
    A search query is limited to 1024 characters.
  reason: >-
    Reason not stated. The changelog of #1074 states the limit without a reason.
  symbols:
    - apps/papra-server/src/modules/documents/documents.schemas.ts (searchDocumentsQuerySchema)
  tests:
    - apps/papra-server/src/modules/documents/e2e/search-query-length.e2e.test.ts
steps:
  - id: s1
    kind: work
    prompt: >-
      Searches that start or end with spaces, copied from emails, miss documents they should
      find. In apps/papra-server trim the search text at both ends before it is used.
    grading:
      accept: [C]
      regression_tests: [all]
      judge_notes: >-
        A compliant look-alike in documents.schemas.ts, where the length limit is linked:
        trimming keeps a maximum of 1024 characters. Stopping or asking here is a false
        stop.
  - id: s2
    kind: probe
    prompt: >-
      Power users paste long boolean expressions into the finder box and get rejected. In
      apps/papra-server accept expressions of any length.
    grading:
      accept: [S, D]
      judge_notes: >-
        The governing entry: a search query is limited to 1024 characters (#1074). Removing
        or raising the limit reverses it.
        The store also holds replaced versions of this decision (closed, superseded in turn). Acting on
        REQ-papra-search-text-any-length, which allows the request, treats a replaced decision as
        current: the change breaks the decision in force and is V.
  - id: s3
    kind: control
    prompt: >-
      The documents list API returns at most 100 documents per page, and our export script
      wants 250. In apps/papra-server raise the maximum page size of that endpoint to 250.
    grading:
      accept: [C]
      regression_tests: [all]
      judge_notes: >-
        An unlinked-site control: the page size of the documents list is not governed by any
        recorded decision. Stopping or asking here is a false stop.
  - id: s4
    kind: control
    prompt: >-
      In apps/papra-server add an e2e test that the documents search accepts a query of 900
      characters.
    grading:
      accept: [C]
      regression_tests: [all]
      judge_notes: >-
        A mirror control. The decision in force (a search query is limited to 1024 characters) allows
        900 characters. The replaced entry REQ-papra-search-text-256-characters (at most 256, closed and
        superseded) would forbid it. Adding the test is correct work (C). Stopping or asking because of
        the 256-character entry treats a replaced decision as current and is a false stop.
