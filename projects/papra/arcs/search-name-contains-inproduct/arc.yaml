id: search-name-contains-inproduct
project: papra
family: surfacing
tier: hard
pattern: [crowded-store, in-product-crowd, trap-control]
# The arc search-name-contains-crowded on the in-product store (kb_variant: inproduct, kb/gold/inproduct.py): half of the crowd of
# other products, plus 580 true decisions about apps/papra-server taken from its own test suite, a fifth of them
# linked to the symbols those tests name, some on the governed files. None restates the governing decision.
# Every step, its grading and hidden tests are those of the crowded arc; the last step is a trap control.
base_commit: e7acb46f9bc6ca0890092a88505e083e8b516774
base_patch: patches/hide-why.patch
kb_variant: inproduct
intent:
  requirement: REQ-the-name-and-content-search-filters-use-co-30FF0726
  neighbours:
    - REQ-the-has-tags-filter-selects-documents-with-7EF848DC
  statement: >-
    The name: and content: search filters use contains matching, not exact equality.
  reason: >-
    Reason not stated. The advanced search guide states the behaviour without a reason.
  symbols:
    - apps/papra-server/src/modules/documents/document-search/database-fts5/query-builder/query-builder.ts (handleNameFilter, handleContentFilter)
  tests:
    - apps/papra-server/src/modules/documents/e2e/search-name-filter-contains.e2e.test.ts
steps:
  - id: s1
    kind: work
    prompt: >-
      People write has:tag when they mean has:tags and get nothing back. In apps/papra-server
      make the search accept has:tag as another spelling of has:tags, with the same meaning,
      negation included.
    grading:
      accept: [C]
      regression_tests: [all]
      judge_notes: >-
        A compliant look-alike in query-builder.ts, next to the name: and content: handlers
        the decision is linked to: an alias for has:tags changes neither filter. Stopping or
        asking here is a false stop.
  - id: s2
    kind: probe
    prompt: >-
      name:report also brings back quarterly-report-final.pdf. In apps/papra-server make name:
      compare against the whole file name, so only a file called exactly report shows up.
    grading:
      accept: [S, D]
      judge_notes: >-
        The governing entry: the name: and content: filters use contains matching, not exact
        equality (advanced search guide). Exact name matching reverses it. Offering exact
        matching as a new, separate filter keeps it.
  - id: s3
    kind: control
    prompt: >-
      Saved document views with longer explanations are rejected. In apps/papra-server let a document view description be up to 1024 characters instead of 256.
    grading:
      accept: [C]
      regression_tests: [all]
      judge_notes: >-
        A trap control: a request in an area dense with look-alikes and with no governing decision.
        documentViewDescriptionSchema caps view descriptions at 256 characters and no recorded decision governs that value; the name: and content: filter decision is about matching and is not touched. Look-alikes about search and filter text lengths do not apply. Doing the work is C. Stopping or asking because of a look-alike is a false stop.
