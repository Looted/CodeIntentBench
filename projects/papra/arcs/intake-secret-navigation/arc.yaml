id: intake-secret-navigation
project: papra
family: navigation
# Parent of papra-hq/papra #892 (February 2026), where the intake webhook secret still accepted any string.
base_commit: 86805aeae078a466de193ab5e52822ad2552cff6
intent:
  statement: >-
    The intake email webhook secret (INTAKE_EMAILS_WEBHOOK_SECRET) must be between 16 and 128
    characters; the config rejects anything else at startup. A default stays in place for
    development and itself satisfies the rule.
  reason: >-
    The secret signs every inbound intake email webhook. A short, empty or guessable value lets
    anyone forge intake emails into an organisation, so the server must refuse to start with one.
  symbols:
    - apps/papra-server/src/modules/intake-emails/intake-emails.config.ts (intakeEmailsConfig.webhookSecret)
  tests:
    - apps/papra-server/src/modules/intake-emails/intake-emails.config.test.ts
steps:
  - id: s1
    kind: intent
    source:
      commit: 1c1d273fbdd7dc433ff18fcb7ae546e4c2197cf9
      pull_request: https://github.com/papra-hq/papra/pull/892
    prompt: >-
      In apps/papra-server the intake email webhook secret (INTAKE_EMAILS_WEBHOOK_SECRET) accepts any
      string. That secret signs every inbound intake email, so a short or empty value means anyone who
      guesses it can forge intake emails into an organisation. Make the config require a length between
      16 and 128 characters, fail startup otherwise, and say so in the setting's doc string. Keep a
      default so development setups still boot, but make sure the default itself passes the new rule.
    grading:
      accept: [C]
      task_tests:
        - apps/papra-server/src/modules/intake-emails/intake-emails.config.test.ts
      regression_tests: [all]
  - id: s2
    kind: work
    source:
      commit: fdd955e20c7bf7732ee39aad216636bc1a88fd6b
      pull_request: https://github.com/papra-hq/papra/pull/896
    prompt: >-
      Some mail providers hand intake email attachments to apps/papra-server with a generic or missing
      content type (application/octet-stream or empty). Add a new module
      src/modules/shared/mime-types/mime-types.usecases.ts exporting
      `coerceFileMimeType({ file }: { file: File }): Promise<{ mimeType: string }>` and use it when
      ingesting intake email attachments: keep a specific declared type as is; for octet-stream or
      empty, detect the type from the file's magic bytes, then from the file name extension, and fall
      back to application/octet-stream.
    grading:
      accept: [C]
      task_tests:
        - apps/papra-server/src/modules/shared/mime-types/mime-types.usecases.test.ts
      regression_tests: [all]
  - id: s3
    kind: probe
    prompt: >-
      Security review question for apps/papra-server: a while ago it was decided that nobody must be
      able to inject forged intake emails into an organisation by guessing the signing secret. Where in
      the code is that enforced, and which test covers it? Point me to the exact places; do not change
      anything.
    grading:
      accept: [C]
      regression_tests: []
      judge_notes: >-
        A question, not a change request. names_symbols is yes only if the answer points at the intake
        emails config's webhookSecret schema (intake-emails.config.ts) as the enforcement point;
        names_decision is yes if the answer states the length rule (16 to 128 characters, rejected at
        startup) as what is enforced there. Naming only the signature check in the ingest route does
        not count as the enforcement of this decision.
