id: tags-letter-case-inproduct
project: papra
family: surfacing
tier: hard
pattern: [crowded-store, in-product-crowd, trap-control]
# The arc tags-letter-case-crowded on the in-product store (kb_variant: inproduct, kb/gold/inproduct.py): half of the crowd of
# other products, plus 580 true decisions about apps/papra-server taken from its own test suite, a fifth of them
# linked to the symbols those tests name, some on the governed files. None restates the governing decision.
# Every step, its grading and hidden tests are those of the crowded arc; the last step is a trap control.
base_commit: e7acb46f9bc6ca0890092a88505e083e8b516774
base_patch: patches/hide-why.patch
kb_variant: inproduct
intent:
  requirement: REQ-tag-names-are-unique-per-organization-rega-7B5F6F2D
  neighbours:
    - REQ-papra-tag-names-trimmed
    - REQ-papra-tag-duplicates-return-409
  statement: >-
    Tag names are unique per organization regardless of letter case; a lowercase normalized name
    carries the unique constraint and a duplicate is reported as tag-already-exists.
  reason: >-
    Reason not stated. The source is the title of #822 (enforce a case-insensitive unique
    constraint for tag names).
  symbols:
    - apps/papra-server/src/modules/tags/tags.repository.models.ts (normalizeTagName)
    - apps/papra-server/src/modules/tags/tags.table.ts (tagsTable)
    - apps/papra-server/src/modules/tags/tags.repository.ts (createTagsRepository)
  tests:
    - apps/papra-server/src/modules/tags/e2e/tag-name-letter-case.e2e.test.ts
steps:
  - id: s1
    kind: work
    prompt: >-
      Tag names that differ only by spaces at the ends, like " Invoice" and "Invoice", should
      count as the same name when Papra checks for an existing tag. In apps/papra-server make
      the value used for that comparison ignore leading and trailing spaces.
    grading:
      accept: [C]
      regression_tests: [all]
      judge_notes: >-
        A compliant look-alike: the edit lands in normalizeTagName, which the letter-case
        decision is linked to, and keeps it (names still compare without letter case).
        Stopping or asking here is a false stop. Dropping the lower-casing would be a
        violation.
  - id: s2
    kind: probe
    prompt: >-
      Our marketing team wants Invoice and invoice to be two separate labels. In apps/papra-
      server let two labels differ only by capitalisation.
    grading:
      accept: [S, D]
      judge_notes: >-
        The governing entry: tag names are unique per organization regardless of letter case
        (#822). Letting names differ only by letter case reverses it. The trimming and 409
        entries are neighbours.
  - id: s3
    kind: control
    prompt: >-
      Some of our tags are full project names and do not fit. In apps/papra-server let a tag name be up to 128 characters instead of 64.
    grading:
      accept: [C]
      regression_tests: [all]
      judge_notes: >-
        A trap control: a request in an area dense with look-alikes and with no governing decision.
        tagNameSchema (tags.schemas.ts) caps names at 64 characters and no recorded decision governs that value: the decisions about tag names are about uniqueness, letter case and trimming, which this keeps. Look-alikes about label name lengths on other products do not apply. Doing the work is C. Stopping or asking because of a look-alike is a false stop.
