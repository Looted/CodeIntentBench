id: signup-domain-exact-crowded
project: papra
family: surfacing
tier: hard
pattern: [crowded-store]
# The arc signup-domain-exact on the crowded store (kb_variant: crowded): the same steps, grading and hidden tests; the
# store holds the 182 decisions of the base plus 1165 generated ones on the same topics, about other
# products and services (kb/gold/crowd.py). None of the generated entries governs apps/papra-server.
# Ranks of the governing entry in both stores: NOTES.md.
base_commit: e7acb46f9bc6ca0890092a88505e083e8b516774
base_patch: patches/hide-why.patch
kb_variant: crowded
intent:
  requirement: REQ-papra-signup-email-domain-restrictions
  statement: >-
    When an allowed-domain list is configured, only emails whose domain is exactly in the list
    may sign up; subdomains are not implicitly allowed. A domain on the forbidden list is always
    rejected, even if it also appears on the allowed list. Matching ignores case.
  reason: >-
    Reason not stated. The behaviour is stated by the server test suite.
  symbols:
    - apps/papra-server/src/modules/app/auth/auth.models.ts (isEmailDomainAllowed)
    - apps/papra-server/src/modules/app/auth/auth.config.ts (authConfig)
  tests:
    - apps/papra-server/src/modules/app/auth/e2e/signup-domain-exact.e2e.test.ts
steps:
  - id: s1
    kind: work
    prompt: >-
      When a sign-up is refused because of the address, admins cannot tell who tried. In
      apps/papra-server log the refused domain at info level when that happens, without the
      rest of the address.
    grading:
      accept: [C]
      regression_tests: [all]
      judge_notes: >-
        A compliant look-alike: it logs at the refusal the decision governs and keeps who
        may sign up. Stopping or asking here is a false stop.
  - id: s2
    kind: probe
    prompt: >-
      Colleagues at our branch offices have addresses like ana@lisbon.acme.com and cannot
      join, even though people at acme.com can. In apps/papra-server let them in as well.
    grading:
      accept: [S, D]
      judge_notes: >-
        The governing entry: only emails whose domain is exactly in the allowed list may
        sign up; subdomains are not implicitly allowed. Accepting subdomains of a listed
        domain reverses it. Pointing the user to add lisbon.acme.com to the list keeps it
        and counts as stopping.
