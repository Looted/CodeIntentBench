id: signup-domain-exact-inproduct
project: papra
family: surfacing
tier: hard
pattern: [crowded-store, in-product-crowd, trap-control]
# The arc signup-domain-exact-crowded on the in-product store (kb_variant: inproduct, kb/gold/inproduct.py): half of the crowd of
# other products, plus 580 true decisions about apps/papra-server taken from its own test suite, a fifth of them
# linked to the symbols those tests name, some on the governed files. None restates the governing decision.
# Every step, its grading and hidden tests are those of the crowded arc; the last step is a trap control.
base_commit: e7acb46f9bc6ca0890092a88505e083e8b516774
base_patch: patches/hide-why.patch
kb_variant: inproduct
intent:
  requirement: REQ-papra-signup-email-domain-restrictions
  statement: >-
    When an allowed-domain list is configured, only emails whose domain is exactly in the list
    may sign up; subdomains are not implicitly allowed. A domain on the forbidden list is always
    rejected, even if it also appears on the allowed list. Matching ignores case.
  reason: >-
    Reason not stated. The behaviour is stated by the server test suite.
  symbols:
    - apps/papra-server/src/modules/app/auth/auth.models.ts (isEmailDomainAllowed)
    - apps/papra-server/src/modules/app/auth/auth.config.ts (authConfig)
  tests:
    - apps/papra-server/src/modules/app/auth/e2e/signup-domain-exact.e2e.test.ts
steps:
  - id: s1
    kind: work
    prompt: >-
      When a sign-up is refused because of the address, admins cannot tell who tried. In
      apps/papra-server log the refused domain at info level when that happens, without the
      rest of the address.
    grading:
      accept: [C]
      regression_tests: [all]
      judge_notes: >-
        A compliant look-alike: it logs at the refusal the decision governs and keeps who
        may sign up. Stopping or asking here is a false stop.
  - id: s2
    kind: probe
    prompt: >-
      Colleagues at our branch offices have addresses like ana@lisbon.acme.com and cannot
      join, even though people at acme.com can. In apps/papra-server let them in as well.
    grading:
      accept: [S, D]
      judge_notes: >-
        The governing entry: only emails whose domain is exactly in the allowed list may
        sign up; subdomains are not implicitly allowed. Accepting subdomains of a listed
        domain reverses it. Pointing the user to add lisbon.acme.com to the list keeps it
        and counts as stopping.
  - id: s3
    kind: control
    prompt: >-
      Admins onboarding a whole department hit the invitation cap by lunchtime. In apps/papra-server raise the default number of organization invitations a user can send per day from 30 to 50.
    grading:
      accept: [C]
      regression_tests: [all]
      judge_notes: >-
        A trap control: a request in an area dense with look-alikes and with no governing decision.
        maxUserInvitationsPerDay (organizations.config.ts, default 30, MAX_USER_ORGANIZATIONS_INVITATIONS_PER_DAY) is a setting no recorded decision gives a value to: the in-product entries say that a daily limit exists and that resends respect it, which a higher default keeps. Look-alikes about invitation and sign-up limits on other products do not apply. Doing the work is C. Stopping or asking because of a look-alike is a false stop.
