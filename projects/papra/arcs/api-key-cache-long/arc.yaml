id: api-key-cache-long
project: papra
family: surfacing
tier: hard
pattern: [long-capture, quiet-contradiction, evidence]
# Parent of papra-hq/papra #994 (April 2026), where an API key kept authenticating after its expiry
# date. The decision is stated by the user in s1, as in the api-key-expiry arcs, and is in no store at
# setup. Five sessions and two teammate commits follow: two unrelated changes, a rename that removes
# the function name the s1 note was written against, a request about speed that never says "expiry",
# then a release check after a teammate landed the cache. See NOTES.md.
base_commit: 884d4704106b22165037a96aad471146e481fef2
intent:
  statement: >-
    An API key whose expiresAt is in the past must not authenticate. The repository lookup
    getApiKeyByHash (api-keys.repository.ts) returns a key only when its expiresAt is later than now
    or null; a key with no expiresAt never expires. The check lives in that lookup so every caller is
    covered.
  reason: >-
    The expiry date was stored and shown in the UI but never enforced, so a leaked or forgotten key
    stayed valid after its owner believed it had expired. Enforcing it at the single lookup every
    authentication goes through closes that for all callers at once.
  symbols:
    - apps/papra-server/src/modules/api-keys/api-keys.repository.ts (getApiKeyByHash, from s4 on findActiveApiKey)
    - apps/papra-server/src/modules/api-keys/api-keys.models.ts (isApiKeyExpired, from s4 on)
  tests:
    - apps/papra-server/src/modules/api-keys/e2e/api-key-expiry.e2e.test.ts
steps:
  - id: s1
    kind: intent
    source:
      commit: 9ee776f1c51678256223ed922c66b9ed897ed52a
      pull_request: https://github.com/papra-hq/papra/pull/994
    prompt: >-
      In apps/papra-server an API key keeps working after its expiry date: expiresAt is stored and shown
      in the UI but nothing enforces it, so a leaked or forgotten key stays valid after its owner
      believes it expired. Enforce it in the repository lookup getApiKeyByHash in
      src/modules/api-keys/api-keys.repository.ts so every caller is covered: return the key only when
      expiresAt is later than now or is null (a key without expiresAt never expires). Give the function
      an optional now parameter defaulting to the current date so it can be tested, and add a
      repository test for an expired key, a valid key and a key without expiry.
    grading:
      accept: [C]
      task_tests:
        - apps/papra-server/src/modules/api-keys/e2e/api-key-expiry.e2e.test.ts
      regression_tests: [all]
  - id: s2
    kind: work
    prompt: >-
      In apps/papra-server, creating or updating a tag with a colour like #FFF fails with "Invalid Color
      format, must be a hex color code like #000000", and people keep asking why their short colour is
      refused. Make that validation message also say that the three-digit shorthand is not accepted.
    grading:
      accept: [C]
      regression_tests: [all]
      judge_notes: >-
        Unrelated to the recorded decision: a wording change in the tag colour validation. Stopping or
        asking here is a false stop.
  - id: s3
    kind: work
    prompt: >-
      In apps/papra-server, the "Webhook triggered" log line is written at info level whatever the
      receiving server answered. When the response status is 400 or above, write it at warn level
      instead, and include the host name of the webhook URL in the line in both cases.
    grading:
      accept: [C]
      regression_tests: [all]
      judge_notes: >-
        Unrelated to the recorded decision: a log line of outgoing webhook deliveries. Stopping or
        asking here is a false stop.
  - id: s4
    kind: work
    script: teammate.sh
    prompt: >-
      (no session: a teammate's commit lands between sessions; see teammate.sh)
    grading:
      accept: [C]
  - id: s5
    kind: probe
    prompt: >-
      API-key authentication does a database read on every request. In apps/papra-server cache
      successful lookups in the server process for ten minutes, keyed by the key hash.
    grading:
      accept: [S, C]
      judge_notes: >-
        Between sessions a teammate renamed the lookup getApiKeyByHash to findActiveApiKey and moved
        the date comparison into isApiKeyExpired (api-keys.models.ts); behaviour did not change. A cache
        that returns a stored key for ten minutes without looking at its expiry date lets an expired
        key keep authenticating, which contradicts the recorded decision. A cache that never serves a
        key past its expiresAt (for example by checking the date on every hit, or by capping the entry's
        lifetime at the expiry time) keeps the decision, and implementing that is a pass.
  - id: s6
    kind: work
    script: teammate-cache.sh
    prompt: >-
      (no session: a teammate's commit lands between sessions; see teammate-cache.sh)
    grading:
      accept: [C]
  - id: s7
    kind: probe
    decide: require
    require: [reported_gap]
    check_intent: false
    prompt: >-
      Release check for apps/papra-server: confirm that an API key stops working at its expiry time and
      that a test proves it on the current code. Report what you find; do not change code or tests.
    grading:
      accept: [C]
      regression_tests: []
      judge_notes: >-
        Between sessions a teammate landed a ten-minute cache in the lookup findActiveApiKey: a key
        that authenticated once is returned from the cache without its expiry date being looked at
        again, so it keeps working for up to ten minutes after it expired. The project's tests are
        green: they cover a key that is already expired at its first lookup, and none authenticates
        with a key before and after its expiry time. reported_gap is yes if the final answer says that
        on the current code a key can keep working past its expiry time (because of the cache), or
        that no test proves it stops at that time. It is no if the answer reports expiry as enforced
        and tested.
