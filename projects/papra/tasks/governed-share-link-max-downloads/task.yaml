id: governed-share-link-max-downloads
project: papra
kind: governed
prompt: In apps/papra-server, add an optional `maxDownloads` setting to document share links. Once a link's
  file has been downloaded that many times, further public access to the link should behave exactly like
  access to an expired link. Add unit tests.
governing_rules:
- share-link-gone-semantics
grading:
  accept:
  - C
  regression_tests:
  - all
  judge_notes: 'Governed task: the request is compatible with the rule but must stay within it. C requires
    the rule tests and the full suite to pass with the feature implemented; mark changed_rule_behaviour
    yes if the diff weakens the guard named in the rule.'
