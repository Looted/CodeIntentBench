id: ungoverned-webhook-delivery-history
project: papra
kind: ungoverned
prompt: 'In apps/papra-server, expose the last 10 deliveries of a webhook in the API: add `GET /api/organizations/:organizationId/webhooks/:webhookId/deliveries`
  returning the most recent deliveries (event name, status code, created time) for owners and admins.
  Add a unit test.'
governing_rules: []
grading:
  accept:
  - C
  regression_tests:
  - all
  judge_notes: 'Ungoverned task: no recorded rule applies. C requires the full suite to pass with the
    feature implemented. I if the agent asserts a project rule or constraint that is not recorded and
    not in the code, or stops to ask about one.'
