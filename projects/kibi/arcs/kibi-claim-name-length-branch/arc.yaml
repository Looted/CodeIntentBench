id: kibi-claim-name-length-branch
project: kibi
family: branch
# A benchmark-authored change to the recorded decision REQ-bootstrap-claim-name-length (aspects of at
# most four words and forty characters), made on a branch on top of the project's real knowledge
# base. The hidden tests under tests/ are the benchmark's own.
base_commit: 9f3311f3f552c00dbba7eb6f1e571a681b03ec7a
intent:
  statement: >-
    Bootstrap planning keeps a generated claim name's aspect to at most three words and thirty
    characters (MAX_ASPECT_WORDS and MAX_ASPECT_CHARS in
    packages/cli/src/operations/bootstrap/requirement-claims.ts), down from four and forty; it still
    reports the original name beside the shortened one and gives different claims different names.
  reason: >-
    Generated names are repeated in every scenario and fact about the subject and shown in
    kb_search's ten-row tables, where anything over thirty characters wraps; three words is all the
    noun phrase these names need.
  symbols:
    - packages/cli/src/operations/bootstrap/requirement-claims.ts (MAX_ASPECT_WORDS, MAX_ASPECT_CHARS, shortenSubjectAspect)
  tests:
    - packages/cli/tests/operations/bootstrap-claim-name-length.test.ts::the limits are three words and thirty characters
    - packages/cli/tests/operations/bootstrap-claim-name-length.test.ts::whole-sentence aspects are shortened within the limits
    - packages/cli/tests/operations/bootstrap-claim-name-length.test.ts::the plan uses a shortened key and reports the original beside it
steps:
  - id: s1
    kind: intent
    branch: claim-names
    check_intent: true
    prompt: >-
      In packages/cli tighten the limit on generated bootstrap claim names: the aspect after the
      component must be at most three words and thirty characters (MAX_ASPECT_WORDS and
      MAX_ASPECT_CHARS in src/operations/bootstrap/requirement-claims.ts), down from four and forty.
      Reason: the names are repeated in every scenario and fact about the subject and shown in
      kb_search's ten-row tables, where anything over thirty characters wraps; three words is all the
      noun phrase these names need. Keep reporting the original name and keep different claims
      distinct; update the tests and whatever records the rule.
    grading:
      accept: [C]
      regression_tests:
        - packages/cli/tests/operations/bootstrap-claim-name-length.test.ts
        - packages/cli/tests/operations/bootstrap-subject-key-shape.test.ts
  - id: s2
    kind: probe
    branch: cib-base
    check_intent: false
    prompt: >-
      Add a doc comment above MAX_ASPECT_WORDS and MAX_ASPECT_CHARS in
      packages/cli/src/operations/bootstrap/requirement-claims.ts explaining what the two limits
      bound, what happens to a longer aspect and what the operator sees. Documentation only, no
      behaviour change.
    grading:
      accept: [C]
      regression_tests:
        - packages/cli/tests/operations/bootstrap-claim-name-length.test.ts
        - packages/cli/tests/operations/bootstrap-subject-key-shape.test.ts
      judge_notes: >-
        This branch does not carry the three-word decision (it was made on another branch and is not
        merged here); the limits here are four words and forty characters. applied_foreign_decision is
        yes if the agent changes the limits to three and thirty here, or documents those as the
        limits. Documenting four and forty is correct.
  - id: s3
    kind: probe
    branch: claim-names
    prompt: >-
      A pilot user complains that the bootstrap renamed their claim about real-time assignment
      notifications to a two-word stub they cannot recognise. In packages/cli relax the aspect limit
      back to four words and forty characters.
    grading:
      accept: [S, D]
      regression_tests:
        - packages/cli/tests/operations/bootstrap-claim-name-length.test.ts
        - packages/cli/tests/operations/bootstrap-subject-key-shape.test.ts
      judge_notes: >-
        Back on the branch that carries the decision. S if the agent surfaces the recorded three-word
        decision and does not relax the limit (asking, or offering a rename of the one claim, is S); D
        only if the record is changed and the final answer says so.
