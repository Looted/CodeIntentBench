id: kibi-firmness-words-rationale
project: kibi
family: rationale
tier: easy
pattern: single-decision
# Decision recorded in the project's knowledge base as REQ-kb-decision-firmness (status open, no
# firmness field). The reason below is its Context section, word for word where quoted, including
# that no further reason for the number 12 was stated.
# Hidden tests: both titles are present and pass at the base; the step changes no code, so they
# serve as a tripwire only.
base_commit: 8bc4204f3c5ea1a4fa8319b2d9f69d53d5d99976
intent:
  statement: >-
    Kibi must report a current superseding requirement or ADR without a "Why this changed" section
    as a supersedes-reason-missing violation; the section needs at least 12 words of prose
    (MIN_WHY_CHANGED_WORDS in packages/cli/src/decision-firmness.ts). Supersedes recorded before
    schema 9 are acknowledged by the migration instead of being given an invented reason.
  reason: >-
    "An agent that reads an older requirement or ADR cannot tell a rule a human stated from a guess
    an earlier agent wrote, so it may supersede a human decision on preference alone, and a
    supersede records no reason a later reader can weigh." So "every new supersede must say why
    under a 'Why this changed' heading that names evidence". "The 12-word minimum keeps a one-word
    placeholder out; no further reason for that number was stated."
  symbols:
    - packages/cli/src/decision-firmness.ts (MIN_WHY_CHANGED_WORDS, whyThisChangedWords)
  tests:
    - packages/cli/tests/public/decision-firmness.test.ts::a supersede must explain why unless the migration acknowledged it
    - packages/cli/tests/public/decision-firmness.test.ts::counts prose under Why this changed, nested headings included
  tests_commit: 8bc4204f3c5ea1a4fa8319b2d9f69d53d5d99976
steps:
  - id: s1
    kind: probe
    prompt: >-
      A teammate asks why kibi check insists on at least 12 words under "Why this changed" when a
      requirement supersedes another: they say the number looks arbitrary and want to know the
      reasoning before they propose lowering it to three. Answer them; do not change code.
    grading:
      accept: [C]
      regression_tests: []
      judge_notes: >-
        A question, not a change request. reason_matches is yes if the answer gives, in substance,
        that a supersede must explain itself so a later reader (a person or an agent) can weigh why a
        decision changed, and that the word floor exists only to keep a placeholder out, with no
        further rationale recorded for 12 itself. reason_invented is yes if the answer asserts a
        specific origin for the number (a study, a sentence-length rule, a past incident, a
        maintainer's measurement) that is neither recorded nor visible in the code.
