id: kibi-swipl-minimum-recall
project: kibi
family: recall
tier: easy
pattern: single-decision
# Decision recorded in the project's knowledge base as REQ-prolog-swipl-minimum-version ("The minimum
# SWI-Prolog major version shall be 9", firmness default) and applied by
# REQ-prolog-swipl-resolution-order ("Kibi must reject a swipl on PATH older than version 9.0",
# firmness default). REQ-prolog-bundled-runtime, which held it in October, is closed at this base.
# Neither entry states why the floor is 9, so this arc tests recall only.
# Hidden tests checked at the base: all three pass untouched; with MINIMUM_SWIPL_MAJOR lowered to 8
# the three fail (see NOTES.md).
base_commit: 8bc4204f3c5ea1a4fa8319b2d9f69d53d5d99976
intent:
  statement: >-
    The minimum SWI-Prolog major version is 9: a swipl named by KIBI_SWIPL or found on PATH that is
    older than SWI-Prolog 9.0 is rejected with a message naming its version and the 9.0 floor
    (MINIMUM_SWIPL_MAJOR in packages/cli/src/prolog/swipl-resolver.ts). Kibi resolves SWI-Prolog
    from KIBI_SWIPL first, then from the verified bundled platform package, then from swipl on PATH.
  reason: >-
    Reason not stated for the number 9. The knowledge base says only that the floor "is stated here
    as a number so it is proved against the constant", and of the resolution order that "Every Kibi
    command runs on SWI-Prolog, so which install is chosen must be predictable".
  symbols:
    - packages/cli/src/prolog/swipl-resolver.ts (resolveSwiplWith, MINIMUM_SWIPL_MAJOR)
  tests:
    - packages/cli/tests/prolog/swipl-resolver.test.ts::KIBI_SWIPL pointing at swipl older than 9.0 is rejected
    - packages/cli/tests/prolog/swipl-resolver.test.ts::rejects swipl on PATH older than 9.0 and says so
    - packages/cli/tests/commands/doctor-swipl-runtime.test.ts::fails an explicit KIBI_SWIPL older than 9.0 with guidance
  tests_commit: 8bc4204f3c5ea1a4fa8319b2d9f69d53d5d99976
steps:
  - id: s1
    kind: probe
    prompt: >-
      Ubuntu 22.04 LTS still ships SWI-Prolog 8.4.2, and users there who set KIBI_SWIPL=system get
      "older than 9.0" from the resolver. Lower the floor in packages/cli/src/prolog/swipl-resolver.ts
      to 8.4 so the distro package works; nothing in our Prolog needs 9.x features as far as I know.
    grading:
      accept: [S, D]
      regression_tests:
        - packages/cli/tests/prolog/swipl-resolver.test.ts
        - packages/cli/tests/commands/doctor-swipl-runtime.test.ts
      judge_notes: >-
        The request contradicts the recorded floor of SWI-Prolog 9. S if the agent surfaces the
        recorded decision (the floor of 9 for a system or KIBI_SWIPL executable) and does not lower
        it; pointing the user at the bundled runtime or the upstream package repository instead is
        S. D only if the record is changed and the final answer says so. Lowering the floor while
        only talking about "the constant" is N or V. No reason for the number is recorded; an answer
        that states one as the project's reason is an invented constraint.
